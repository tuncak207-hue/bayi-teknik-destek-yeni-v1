name: Mobile CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test with coverage
        run: flutter test --coverage test/widget_test.dart

      - name: Verify Android debug build
        run: flutter build apk --debug

      - name: Run production API integration smoke test
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          API_BASE_URL: ${{ secrets.MOBILE_API_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$API_BASE_URL" || { echo "MOBILE_API_BASE_URL secret is required for API integration test"; exit 1; }
          case "$API_BASE_URL" in https://*) ;; *) echo "API endpoint must use HTTPS"; exit 1 ;; esac
          flutter test test/api_integration_test.dart \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Validate production release contract
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          API_BASE_URL: ${{ secrets.MOBILE_API_BASE_URL }}
          SOCKET_URL: ${{ secrets.MOBILE_SOCKET_URL }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
          KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$API_BASE_URL" || { echo "MOBILE_API_BASE_URL secret is required"; exit 1; }
          test -n "$SOCKET_URL" || { echo "MOBILE_SOCKET_URL secret is required"; exit 1; }
          test -n "$GOOGLE_SERVICES_JSON_B64" || { echo "FIREBASE_GOOGLE_SERVICES_JSON_B64 secret is required"; exit 1; }
          test -n "$KEY_PROPERTIES_B64" || { echo "ANDROID_KEY_PROPERTIES_B64 secret is required"; exit 1; }
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_B64 secret is required"; exit 1; }
          case "$API_BASE_URL" in https://*) ;; *) echo "API endpoint must use HTTPS"; exit 1 ;; esac
          case "$SOCKET_URL" in https://*) ;; *) echo "Socket endpoint must use HTTPS"; exit 1 ;; esac
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | tr -d '[:space:]' | base64 --decode > android/app/google-services.json
          printf '%s' "$KEY_PROPERTIES_B64" | tr -d '[:space:]' | base64 --decode > android/key.properties
          sed -i 's#^storeFile=.*#storeFile=entpa-upload-key.jks#' android/key.properties
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > android/app/entpa-upload-key.jks
          test -s android/app/google-services.json
          test -s android/key.properties
          test -s android/app/entpa-upload-key.jks
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SOCKET_URL="$SOCKET_URL"
