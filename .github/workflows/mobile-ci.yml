name: Mobile CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test with coverage
        run: flutter test --coverage

      - name: Verify Android debug build
        run: flutter build apk --debug

      - name: Validate production release contract
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          API_BASE_URL: ${{ secrets.MOBILE_API_BASE_URL }}
          SOCKET_URL: ${{ secrets.MOBILE_SOCKET_URL }}
        run: |
          set -euo pipefail
          test -n "$API_BASE_URL" || { echo "MOBILE_API_BASE_URL secret is required"; exit 1; }
          test -n "$SOCKET_URL" || { echo "MOBILE_SOCKET_URL secret is required"; exit 1; }
          case "$API_BASE_URL" in https://*) ;; *) echo "API endpoint must use HTTPS"; exit 1 ;; esac
          case "$SOCKET_URL" in https://*) ;; *) echo "Socket endpoint must use HTTPS"; exit 1 ;; esac
          test -f android/app/google-services.json || { echo "google-services.json is required for release"; exit 1; }
          test -f android/key.properties || { echo "key.properties is required for release signing"; exit 1; }
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SOCKET_URL="$SOCKET_URL"
