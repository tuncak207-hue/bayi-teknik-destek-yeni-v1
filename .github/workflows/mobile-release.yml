name: Mobile Production Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: mobile-production-release
  cancel-in-progress: false

env:
  FLUTTER_CHANNEL: stable

jobs:
  release:
    name: Build signed Android release
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Materialize production-only files
        env:
          KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEY_PROPERTIES_B64" || { echo "Missing ANDROID_KEY_PROPERTIES_B64"; exit 1; }
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_B64"; exit 1; }
          test -s android/app/google-services.json || { echo "Missing checked-in android/app/google-services.json"; exit 1; }
          if ! node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json', 'utf8'))"; then
            echo "android/app/google-services.json is not valid JSON"
            exit 1
          fi
          if ! printf '%s' "$KEY_PROPERTIES_B64" | tr -d '[:space:]' | base64 --decode > android/key.properties; then
            echo "Invalid Base64: ANDROID_KEY_PROPERTIES_B64"
            exit 1
          fi
          # Local key.properties may contain a Windows absolute path. CI uses an app-relative path.
          grep -q '^storeFile=' android/key.properties || { echo "key.properties must define storeFile"; exit 1; }
          sed -i 's#^storeFile=.*#storeFile=entpa-upload-key.jks#' android/key.properties
          KEYSTORE_PATH="android/app/entpa-upload-key.jks"
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          if ! printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"; then
            echo "Invalid Base64: ANDROID_KEYSTORE_B64"
            exit 1
          fi
          test -s android/app/google-services.json
          test -s android/key.properties
          test -s "$KEYSTORE_PATH"

      - name: Validate production endpoints
        env:
          API_BASE_URL: https://bayi-teknik-destek-yeni-v1-1.onrender.com/api/v1
          SOCKET_URL: https://bayi-teknik-destek-yeni-v1-1.onrender.com/chat
        run: |
          set -euo pipefail
          API_BASE_URL=$(printf '%s' "$API_BASE_URL" | tr -d '[:space:]')
          SOCKET_URL=$(printf '%s' "$SOCKET_URL" | tr -d '[:space:]')
          test -n "$API_BASE_URL" || { echo "Missing MOBILE_API_BASE_URL"; exit 1; }
          test -n "$SOCKET_URL" || { echo "Missing MOBILE_SOCKET_URL"; exit 1; }
          case "$API_BASE_URL" in https://*) ;; *) echo "MOBILE_API_BASE_URL must use HTTPS"; exit 1 ;; esac
          case "$SOCKET_URL" in https://*) ;; *) echo "MOBILE_SOCKET_URL must use HTTPS"; exit 1 ;; esac

      - name: Run production API smoke test
        env:
          API_BASE_URL: https://bayi-teknik-destek-yeni-v1-1.onrender.com/api/v1
        run: |
          set -euo pipefail
          API_BASE_URL=$(printf '%s' "$API_BASE_URL" | tr -d '[:space:]')
          response=$(curl --fail --silent --show-error --retry 3 --retry-delay 5 "$API_BASE_URL/health")
          echo "$response" | grep -q '"status":"ok"'

      - name: Build signed release App Bundle
        env:
          API_BASE_URL: https://bayi-teknik-destek-yeni-v1-1.onrender.com/api/v1
          SOCKET_URL: https://bayi-teknik-destek-yeni-v1-1.onrender.com/chat
        run: |
          set -euo pipefail
          API_BASE_URL=$(printf '%s' "$API_BASE_URL" | tr -d '[:space:]')
          SOCKET_URL=$(printf '%s' "$SOCKET_URL" | tr -d '[:space:]')
          flutter build appbundle --release --build-number=52 "--dart-define=API_BASE_URL=$API_BASE_URL" "--dart-define=SOCKET_URL=$SOCKET_URL"

      - name: Upload signed App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: entpa-android-aab-${{ github.ref_name }}-${{ github.run_number }}
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
