name: iOS CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Flutter iOS analyze, test and build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        env:
          MOBILE_API_BASE_URL: ${{ secrets.MOBILE_API_BASE_URL }}
        run: |
          test -n "$MOBILE_API_BASE_URL" || { echo "MOBILE_API_BASE_URL secret is required"; exit 1; }
          flutter test --dart-define=API_BASE_URL="$MOBILE_API_BASE_URL" --coverage test/api_integration_test.dart

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Build iOS release without signing
        run: flutter build ios --release --no-codesign
