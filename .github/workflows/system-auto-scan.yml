name: Continuous System Scan

on:
  schedule:
    # GitHub schedule gecikmeli çalışabilir; hedef periyot 10 dakikadır.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: continuous-system-scan
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test with coverage
        run: flutter test --coverage test/widget_test.dart

      - name: Production API smoke test
        env:
          MOBILE_API_BASE_URL: ${{ secrets.MOBILE_API_BASE_URL }}
        run: |
          if [ -z "$MOBILE_API_BASE_URL" ]; then
            echo "MOBILE_API_BASE_URL is not configured; production smoke test skipped."
            exit 0
          fi
          case "$MOBILE_API_BASE_URL" in
            https://*) ;;
            *) echo "MOBILE_API_BASE_URL must use HTTPS"; exit 1 ;;
          esac
          flutter test test/api_integration_test.dart \\
            --dart-define=API_BASE_URL="$MOBILE_API_BASE_URL"

  backend:
    name: Backend build, tests and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --runInBand

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  admin:
    name: Admin build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  low-risk-autofix:
    name: Low-risk formatting PR
    runs-on: ubuntu-latest
    needs: [mobile]
    if: ${{ needs.mobile.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Dart formatting only
        working-directory: mobile
        run: dart format lib test

      - name: Create pull request when formatting changed
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/low-risk-formatting
          delete-branch: true
          commit-message: 'style(mobile): apply automated Dart formatting'
          title: 'chore: automated low-risk formatting'
          body: |
            This PR was created by the scheduled system scan.

            It contains only Dart formatter output under `mobile/lib` and `mobile/test`.
            No authentication, backend, database, Firebase, signing, dependency upgrade,
            or production configuration changes are made automatically.

            Please review the diff and merge only after the normal CI checks pass.
          labels: |
            automation
            low-risk
            mobile

      - name: Report formatter PR permission limitation
        if: ${{ failure() }}
        run: echo "Formatter changes were generated, but GitHub token cannot create pull requests in this repository; review automation/low-risk-formatting manually."
