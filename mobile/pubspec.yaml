name: bayi_teknik_destek
description: Yangın Alarm & Kamera Bayi Teknik Destek Uygulaması
publish_to: "none"
version: 0.1.0+56

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.1

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.5.0
  socket_io_client: ^2.0.3+1

  # Local secure storage (JWT, refresh token)
  flutter_secure_storage: ^9.2.2

  # Routing
  go_router: ^14.2.0

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.0
  flutter_markdown: ^0.7.3
  shimmer: ^3.0.0

  # Media
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  open_filex: ^4.5.0
  audioplayers: ^6.1.0

  # Push notifications
  firebase_core: ^3.4.1
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2

  # Sosyal/telefon girişi
  google_sign_in: ^6.2.1
  firebase_auth: ^5.3.1

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.5
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.1
  path_provider: ^2.1.4

  # Ekstra premium özellikler
  pdf: ^3.10.8
  local_auth: ^2.3.0
  mobile_scanner: ^5.2.3
  share_plus: ^10.0.2
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  flutter_launcher_icons: ^0.13.1

flutter:
  # Kullanıcı isteği: "İngilizce dil desteği ekle" — ARB tabanlı resmi
  # Flutter yerelleştirme sistemi.
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/fonts/
  # Kullanıcı isteği: "Uygulamanın tamamında Android ve iOS dahil olmak
  # üzere TEK FONT AİLESİ kullan: Inter." Platform sistem fontuna
  # (Roboto/SF Pro) geçiş yapılmıyor — her iki platformda da aynı,
  # gömülü Inter font dosyaları kullanılıyor.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: false # bu proje şimdilik sadece Android için hedefleniyor
  image_path: "assets/images/entpa_logo.png"
  min_sdk_android: 21
